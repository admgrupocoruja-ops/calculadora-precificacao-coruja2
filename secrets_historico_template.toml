# ============================================================================
# HISTÓRICO DE USO — configuração do Google Sheets (Secrets do Streamlit)
# ============================================================================
# Isto NÃO é um arquivo de código do projeto — é o texto para você colar em
# Secrets (share.streamlit.io -> seu app -> Settings -> Secrets), junto com
# o bloco [usuarios] que já existe lá.
#
# O que isto faz: toda vez que alguém clicar em "Calcular Autorização" na
# calculadora, uma linha é adicionada numa planilha Google (data/hora, quem
# usou, ativo, valor negociado, desconto, margem, se foi autorizado etc.) —
# um histórico permanente, mesmo que a tela da calculadora não mostre esses
# números para quem está simulando.
#
# PASSO A PASSO (feito uma única vez):
#
# 1) Crie (ou use) um projeto em https://console.cloud.google.com
#
# 2) Nesse projeto, ative duas APIs (menu "APIs e Serviços" -> "Ativar
#    APIs e Serviços" -> procure e ative cada uma):
#      - Google Sheets API
#      - Google Drive API
#
# 3) Crie uma "Conta de Serviço" (Service Account):
#    IAM e Admin -> Contas de Serviço -> Criar Conta de Serviço.
#    Dê um nome qualquer (ex.: "calculadora-historico"). Não precisa
#    conceder nenhum papel/permissão especial no projeto — pode pular
#    essa etapa e clicar em "Concluir".
#
# 4) Gere uma chave para essa conta de serviço:
#    Abra a conta de serviço criada -> aba "Chaves" -> "Adicionar Chave"
#    -> "Criar nova chave" -> formato JSON -> Criar.
#    Isso baixa um arquivo .json no seu computador — é a "credencial".
#    Guarde-o com cuidado (ele dá acesso à planilha do histórico) e NUNCA
#    o suba para o GitHub.
#
# 5) Crie a planilha do histórico:
#    Vá em https://sheets.google.com e crie uma planilha nova (ex.:
#    "Histórico Calculadora Comercial - Grupo Coruja").
#    Clique em "Compartilhar" e adicione, como Editor, o e-mail da conta
#    de serviço — está dentro do arquivo .json, no campo "client_email"
#    (algo como calculadora-historico@SEU-PROJETO.iam.gserviceaccount.com).
#    Sem esse compartilhamento, a conta de serviço não consegue escrever
#    na planilha.
#
# 6) Copie a URL dessa planilha (a barra de endereço do navegador, algo
#    como https://docs.google.com/spreadsheets/d/XXXXXXXXXXXX/edit).
#
# 7) Preencha os dois campos abaixo com os dados dos passos 4 e 6, e cole
#    este bloco inteiro em Secrets, junto com o bloco [usuarios] que já
#    está lá (não substitua o [usuarios] — são seções diferentes do mesmo
#    Secrets).
# ============================================================================

[historico]
planilha_url = "COLE_AQUI_A_URL_DA_PLANILHA_DO_PASSO_6"

# Cole aqui o CONTEÚDO INTEIRO do arquivo .json baixado no passo 4, exatamente
# como ele é, entre as três aspas duplas — incluindo as chaves { } externas.
# Exemplo do formato esperado (com valores fictícios):
gcp_service_account_json = """
{
  "type": "service_account",
  "project_id": "seu-projeto-123456",
  "private_key_id": "abc…",
  "private_key": "-----BEGIN PRIVATE KEY-----\nMIIE...\n-----END PRIVATE KEY-----\n",
  "client_email": "calculadora-historico@seu-projeto-123456.iam.gserviceaccount.com",
  "client_id": "1234567890",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token",
  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
  "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/calculadora-historico%40seu-projeto-123456.iam.gserviceaccount.com",
  "universe_domain": "googleapis.com"
}
"""

# Enquanto esta seção não estiver configurada (ou se o Google Sheets falhar
# por qualquer motivo), a calculadora continua funcionando normalmente — só
# aparece um aviso discreto de que aquela simulação não entrou no histórico.
