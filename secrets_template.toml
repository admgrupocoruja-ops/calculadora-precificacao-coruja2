# ----------------------------------------------------------------------------
# Usuários: quem pode acessar a calculadora, com qual nome e qual cargo/alçada.
# O cargo aqui é o que efetivamente autoriza ou recusa a negociação — não é
# mais escolhido na tela, é travado ao login. Cada pessoa tem seu próprio
# login (e-mail) e senha — ninguém compartilha credencial.
#
# Para cada pessoa, use o e-mail corporativo como nome do bloco (entre
# colchetes duplos, "usuarios.email@dominio.com") e preencha:
#   nome        = como o nome dela deve aparecer na tela
#   cargo       = EXATAMENTE um destes 4 valores (copie e cole, sem acento
#                 trocado nem espaço a mais):
#                   "Executivo" | "Gerente Comercial" | "Diretor Comercial"
#                   | "Diretor Financeiro"
#   senha_hash  = NÃO é a senha em texto puro — é o hash gerado pelo script
#                 gerar_hash_senha.py (rode "python3 gerar_hash_senha.py" no
#                 seu computador, digite a senha da pessoa quando pedir, e
#                 cole aqui o valor que o script devolver)
#
# Qualquer e-mail que não estiver cadastrado aqui é barrado automaticamente
# na tela de login, e qualquer cargo digitado errado (fora da lista acima)
# também barra o acesso dessa pessoa até ser corrigido.
# ----------------------------------------------------------------------------

[usuarios."glauco.araujo@grupocoruja.com"]
nome = "Glauco Araújo"
cargo = "Diretor Financeiro"
senha_hash = "COLE_AQUI_O_HASH_GERADO_PELO_SCRIPT"

# Para cadastrar mais pessoas, copie o bloco acima, troque o e-mail, o nome,
# o cargo e gere um hash novo para a senha de cada uma. Exemplo (apague os
# "#" do início das linhas depois de preencher com os dados reais):

# [usuarios."fulano@grupocoruja.com"]
# nome = "Fulano de Tal"
# cargo = "Executivo"
# senha_hash = "COLE_AQUI_O_HASH_GERADO_PELO_SCRIPT"

# [usuarios."gerente@grupocoruja.com"]
# nome = "Nome do Gerente"
# cargo = "Gerente Comercial"
# senha_hash = "COLE_AQUI_O_HASH_GERADO_PELO_SCRIPT"

# [usuarios."diretor.comercial@grupocoruja.com"]
# nome = "Nome do Diretor Comercial"
# cargo = "Diretor Comercial"
# senha_hash = "COLE_AQUI_O_HASH_GERADO_PELO_SCRIPT"
